<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Platinum Returns | Market Intelligence</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#07111f;
  color:#f5f7fa;
  line-height:1.6;
}
a{text-decoration:none;color:inherit}

nav{
  position:sticky;top:0;z-index:100;
  background:rgba(7,17,31,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #1d3047;
}
.nav{
  max-width:1150px;margin:auto;
  padding:18px 22px;
  display:flex;align-items:center;justify-content:space-between;
}
.logo{
  font-size:20px;font-weight:800;
  letter-spacing:.5px;
}
.logo span{color:#d9b45b}
.navlinks{display:flex;gap:25px;font-size:14px;color:#aebbd0}
.navlinks a:hover{color:#fff}

.hero{
  max-width:1150px;margin:auto;
  padding:95px 22px 80px;
  display:grid;grid-template-columns:1.2fr .8fr;
  gap:50px;align-items:center;
}
.badge{
  display:inline-block;
  border:1px solid #66552a;
  background:#17160f;
  color:#e2c66d;
  padding:7px 13px;border-radius:30px;
  font-size:12px;font-weight:bold;
  margin-bottom:20px;
}
h1{
  font-size:clamp(42px,6vw,72px);
  line-height:1.02;
  letter-spacing:-2px;
}
.gold{color:#dfbd61}
.hero p{
  margin:25px 0;
  color:#aebbd0;
  max-width:650px;
  font-size:18px;
}
.buttons{display:flex;gap:13px;flex-wrap:wrap}
.btn{
  padding:13px 20px;border-radius:9px;
  font-weight:bold;font-size:14px;
}
.primary{background:#d9b45b;color:#07111f}
.secondary{border:1px solid #33465e;color:#fff}

.panel{
  border:1px solid #243852;
  background:linear-gradient(145deg,#0d1b2d,#091421);
  border-radius:18px;padding:25px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}
.panel-title{color:#8798af;font-size:13px;margin-bottom:15px}
.market{
  display:flex;justify-content:space-between;
  padding:16px 0;border-bottom:1px solid #203148;
}
.market:last-child{border-bottom:0}
.market strong{display:block}
.up{color:#50d890}.neutral{color:#e1c86b}

section{padding:75px 22px}
.container{max-width:1150px;margin:auto}
.section-title{
  font-size:34px;margin-bottom:12px;
}
.section-sub{color:#8fa0b8;margin-bottom:35px}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}
.card{
  background:#0b1929;
  border:1px solid #1e334c;
  border-radius:15px;padding:25px;
}
.icon{
  width:42px;height:42px;
  display:grid;place-items:center;
  border-radius:10px;
  background:#1b1b13;color:#e1c36b;
  margin-bottom:18px;font-weight:bold;
}
.card h3{margin-bottom:8px}
.card p{color:#8fa0b8;font-size:14px}

table{
  width:100%;border-collapse:collapse;
  background:#0b1929;
  border:1px solid #20364f;
  border-radius:14px;overflow:hidden;
}
th,td{
  padding:17px;text-align:left;
  border-bottom:1px solid #20364f;
  font-size:14px;
}
th{color:#9eacc0;background:#0e2034}
td{color:#dce3eb}
tr:last-child td{border-bottom:0}

.cta{
  text-align:center;
  border:1px solid #4c4122;
  background:linear-gradient(135deg,#17170f,#0b1929);
  border-radius:20px;padding:55px 25px;
}
.cta p{color:#9eacc0;margin:12px auto 25px;max-width:650px}

footer{
  border-top:1px solid #1d3047;
  padding:30px 22px;color:#718198;
  font-size:13px;
}
.footer{
  max-width:1150px;margin:auto;
  display:flex;justify-content:space-between;gap:20px;
}

@media(max-width:800px){
  .navlinks{display:none}
  .hero{grid-template-columns:1fr;padding-top:65px}
  .cards{grid-template-columns:1fr}
  h1{letter-spacing:-1px}
  table{
